<div class="auth">
  <app-toast></app-toast>
  <div class="auth-container">
    <div class="auth-img">
      <img src="assets/images/auth-img.png" alt="" />
    </div>
    <div class="auth-form">
      <div class="auth-form--logo">
        <img src="assets/images/auth-logo.png" alt="" />
      </div>

      <div class="auth-form--header">
        <h1 class="auth-form--title">{{ 'FORGOT_PASSWORD_TITLE' | translate }}</h1>
        <p class="auth-form--subtitle">
          {{ 'FORGOT_PASSWORD_SUBTITLE' | translate }}
        </p>
      </div>

      <form
        class="auth-form--inputs"
        [formGroup]="forgotForm"
        (ngSubmit)="onSubmit()"
      >
        <div class="auth-form--group">
          <label for="email">{{ 'E-Mail Address' | translate }}</label>
          <div class="input-container" [class.error]="isFieldInvalid('email')">
            <img
              src="./assets/icons/email.svg"
              alt="mail icon"
              class="input-icon"
            />
            <input
              type="email"
              name="email"
              id="email"
              formControlName="email"
              [placeholder]="'EMAIL_PLACEHOLDER' | translate"
              required
            />
          </div>
          <div *ngIf="getFieldError('email')" class="field-error">
            {{ getFieldError('email') | translate }}
          </div>
          <div *ngIf="emailServerError" class="field-error">
            {{ emailServerError }}
          </div>
        </div>

        <button
          type="submit"
          class="auth-form--submit"
          [disabled]="isSubmitDisabled"
        >
          <span *ngIf="!isLoading && cooldownSeconds === 0">{{
            'SEND_RESET_LINK' | translate
          }}</span>
          <span *ngIf="isLoading">{{ 'Sending...' | translate }}</span>
          <span *ngIf="!isLoading && cooldownSeconds > 0">{{
            'RETRY_IN_SECONDS' | translate : { seconds: cooldownSeconds }
          }}</span>
        </button>
      </form>

      <div class="auth-link">
        <a routerLink="/login">{{ 'BACK_TO_LOGIN' | translate }}</a>
      </div>

      <button (click)="toggleLanguage()" class="lang-btn" type="button">
        {{ 'lang' | translate }}
      </button>
    </div>
  </div>
</div>
